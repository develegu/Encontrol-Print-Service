[package]
name = "en-control-print-service"
version = "0.2.2"
edition = "2021"
authors = ["En-Control Team"]
description = "Servicio local de impresión para En-Control PWA"

[dependencies]
# Servidor HTTP ultra-rápido
actix-web = "4.4"
actix-cors = "0.7"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialización JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Detección de impresoras multiplataforma
printers = "2.2"

# Auto-actualización
self_update = "0.39"

# Logging
env_logger = "0.11"
log = "0.4"

[profile.release]
# Optimizaciones para producción
opt-level = "z"        # Optimizar para tamaño
lto = true             # Link Time Optimization
codegen-units = 1      # Mejor optimización (compilación más lenta)
strip = true           # Eliminar símbolos de debug
panic = "abort"        # Reduce tamaño del binario

# Configuración por plataforma
[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.6"
windows = { version = "0.52", features = ["Win32_Graphics_Printing", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Librerías específicas de Mac si se necesitan
