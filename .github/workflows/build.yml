name: Build and Release

on:
  push:
    tags:
      - "v*" # Trigger cuando hagas push de un tag como v0.1.0
  workflow_dispatch: # Permite ejecutar manualmente

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: en-control-print-service.exe
            asset_name: en-control-print-service-windows-x64.exe

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: en-control-print-service
            asset_name: en-control-print-service-macos-x64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: en-control-print-service
            asset_name: en-control-print-service-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ -f "${{ matrix.artifact_name }}" ]; then
            # macOS targets: preserve executable bit and compress to tar.gz
            if [[ "${{ matrix.target }}" == *"apple-darwin"* ]]; then
              chmod +x "${{ matrix.artifact_name }}"
              strip "${{ matrix.artifact_name }}" || true
              tar -czf "${{ matrix.asset_name }}.tar.gz" "${{ matrix.artifact_name }}"
            else
              mv "${{ matrix.artifact_name }}" "${{ matrix.asset_name }}"
            fi
          fi

      # --- On Windows: build MSI installer using WiX ---
      - name: Install WiX Toolset (choco)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install wixtoolset -y --no-progress

      - name: Prepare executable for WiX
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $src = "target\${{ matrix.target }}\release\${{ matrix.artifact_name }}"
          $dstDir = "target\release"
          Write-Host "Checking for built exe at: $src"
          if (-not (Test-Path $src)) {
            Write-Host "ERROR: Source exe not found: $src"
            Write-Host "Listing target folders for debugging:";
            Get-ChildItem -Recurse -Force -ErrorAction SilentlyContinue target | Select-Object -First 200 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          New-Item -ItemType Directory -Force -Path $dstDir | Out-Null
          Copy-Item -Path $src -Destination (Join-Path $dstDir 'en-control-print-service.exe') -Force

      - name: Build MSI with WiX
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # compile installer.wxs -> installer.wixobj -> EnControlPrintService.msi
          candle installer.wxs
          light -ext WixUIExtension -out EnControlPrintService.msi installer.wixobj

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.asset_name }}*

      # Upload MSI if present
      - name: Upload MSI artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: EnControlPrintService.msi
          path: EnControlPrintService.msi

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ./artifacts/**/*
