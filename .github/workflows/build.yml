name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: en-control-print-service
            asset_name: en-control-print-service-macos-x64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: en-control-print-service
            asset_name: en-control-print-service-macos-arm64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: en-control-print-service.exe
            asset_name: en-control-print-service-windows-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Show build artifacts
        shell: bash
        run: |
          echo "Listing target for debugging..."
          if [ -d "target/${{ matrix.target }}/release" ]; then
            ls -la "target/${{ matrix.target }}/release" || true
          fi
          echo "Find any en-control-print-service files:";
          find target -maxdepth 4 -type f -name "en-control-print-service*" -print || true

      - name: Prepare artifact
        shell: bash
        run: |
          set -e
          cd target/${{ matrix.target }}/release
          if [ -f "${{ matrix.artifact_name }}" ]; then
            if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
              7z a -tzip "${{ matrix.asset_name }}.zip" "${{ matrix.artifact_name }}"
            else
              chmod +x "${{ matrix.artifact_name }}"
              strip "${{ matrix.artifact_name }}" || true
              tar -czf "${{ matrix.asset_name }}.tar.gz" "${{ matrix.artifact_name }}"
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.asset_name }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ./artifacts/**/*
